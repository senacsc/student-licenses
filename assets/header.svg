<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#230254"/>
      <stop offset="0.55" stop-color="#48108B"/>
      <stop offset="1" stop-color="#630DC9"/>
    </linearGradient>
    <radialGradient id="glow" cx="1040" cy="150" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F244AC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F244AC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F244AC"/>
      <stop offset="1" stop-color="#630DC9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F244AC"/>
      <stop offset="1" stop-color="#F6A824"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
  <g clip-path="url(#r)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- ícone </> em losango -->
  <g transform="translate(1030 150)">
    <rect x="-78" y="-78" width="156" height="156" rx="34" transform="rotate(45)" fill="url(#icon)"/>
    <rect x="-62" y="-62" width="124" height="124" rx="26" transform="rotate(45)" fill="#230254" fill-opacity="0.35"/>
    <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -26 -26 L -52 0 L -26 26"/>
      <path d="M 26 -26 L 52 0 L 26 26"/>
      <path d="M 9 -34 L -9 34"/>
    </g>
  </g>

  <!-- selo Senac SC -->
  <rect x="64" y="52" width="226" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/>
  <text x="177" y="77" text-anchor="middle" font-family="Raleway, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#FFFFFF">GUIA DO ESTUDANTE</text>

  <!-- título -->
  <rect x="64" y="112" width="148" height="58" rx="10" fill="#F244AC"/>
  <text x="138" y="155" text-anchor="middle" font-family="Raleway, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF">JOVEM</text>
  <text x="226" y="157" font-family="Raleway, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="1" fill="#FFFFFF">PROGRAMADOR</text>

  <text x="66" y="214" font-family="Raleway, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">Licenças e benefícios gratuitos para estudantes · IA na IDE</text>

  <rect x="0" y="288" width="1200" height="12" fill="url(#bar)"/>
  </g>
</svg>
